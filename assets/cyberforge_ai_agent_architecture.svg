<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#040714"/>
    <stop offset="52%" stop-color="#0b1025"/>
    <stop offset="100%" stop-color="#03050d"/>
  </linearGradient>
  <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38d9ff"/>
    <stop offset="100%" stop-color="#7567ff"/>
  </linearGradient>
  <linearGradient id="tools" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#a56cff"/>
    <stop offset="100%" stop-color="#d65cff"/>
  </linearGradient>
  <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#36e5c0"/>
    <stop offset="100%" stop-color="#42f5a5"/>
  </linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3bdcff"/>
    <stop offset="50%" stop-color="#a36cff"/>
    <stop offset="100%" stop-color="#3ee9bd"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#263354" stroke-width="1" opacity=".25"/>
  </pattern>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#a98cff"/>
  </marker>
</defs>

<rect width="1000" height="1200" fill="url(#bg)"/>
<rect width="1000" height="1200" fill="url(#grid)" opacity=".38"/>
<ellipse cx="500" cy="590" rx="330" ry="480" fill="#705cff" opacity=".05" filter="url(#soft)"/>

<!-- Header -->
<text x="500" y="68" text-anchor="middle" fill="#8c9abb"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="5">
  CYBERFORGE • AGENT ARCHITECTURE
</text>
<text x="500" y="108" text-anchor="middle" fill="#ffffff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">
  AI-DRIVEN INVESTIGATION FLOW
</text>

<!-- Main spine -->
<line x1="500" y1="145" x2="500" y2="1050" stroke="url(#spine)" stroke-width="3" opacity=".55" filter="url(#glow)"/>

<!-- AI / AGENT CARD -->
<g>
  <rect x="125" y="155" width="750" height="265" rx="34" fill="#3bdcff" opacity=".06" filter="url(#soft)"/>
  <rect x="125" y="145" width="750" height="265" rx="34" fill="#0d1730" stroke="url(#agent)" stroke-width="3"/>
  <rect x="125" y="145" width="8" height="265" rx="4" fill="#38d9ff"/>

  <!-- AI icon -->
  <circle cx="205" cy="215" r="38" fill="#38d9ff" opacity=".10"/>
  <rect x="180" y="190" width="50" height="50" rx="12" fill="none" stroke="#54e2ff" stroke-width="3"/>
  <circle cx="194" cy="214" r="5" fill="#54e2ff"/>
  <circle cx="216" cy="214" r="5" fill="#54e2ff"/>
  <path d="M194 226 Q205 234 216 226" fill="none" stroke="#54e2ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M205 178v12M205 240v12M173 215h7M230 215h7" stroke="#54e2ff" stroke-width="2"/>

  <text x="270" y="210" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="27" font-weight="800" letter-spacing="1">AI / AGENT</text>
  <text x="270" y="244" fill="#7483a5" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="13" letter-spacing="2.5">AUTONOMOUS INVESTIGATION CORE</text>

  <line x1="165" y1="275" x2="835" y2="275" stroke="#263a61" stroke-width="1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
    <circle cx="190" cy="310" r="5" fill="#38d9ff"/>
    <text x="210" y="316" fill="#c5d0e6">Investigate</text>
    <circle cx="400" cy="310" r="5" fill="#6f8dff"/>
    <text x="420" y="316" fill="#c5d0e6">Correlate</text>
    <circle cx="600" cy="310" r="5" fill="#9b73ff"/>
    <text x="620" y="316" fill="#c5d0e6">Assess</text>
  </g>

  <rect x="165" y="350" width="670" height="34" rx="17" fill="#38d9ff" opacity=".07"/>
  <text x="500" y="373" text-anchor="middle" fill="#69e7ff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">
    DECISION • REASONING • ORCHESTRATION
  </text>
</g>

<!-- Connector + MCP badge -->
<line x1="500" y1="410" x2="500" y2="490" stroke="#a36cff" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"/>
<rect x="530" y="433" width="110" height="34" rx="17" fill="#a36cff" opacity=".12" stroke="#a36cff" stroke-width="1.5"/>
<text x="585" y="456" text-anchor="middle" fill="#c39aff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">MCP</text>

<!-- TOOLS CARD -->
<g>
  <rect x="125" y="490" width="750" height="285" rx="34" fill="#a56cff" opacity=".06" filter="url(#soft)"/>
  <rect x="125" y="480" width="750" height="285" rx="34" fill="#130f2d" stroke="url(#tools)" stroke-width="3"/>
  <rect x="125" y="480" width="8" height="285" rx="4" fill="#a56cff"/>

  <!-- tools icon -->
  <circle cx="205" cy="550" r="38" fill="#a56cff" opacity=".10"/>
  <path d="M181 561 L207 535 L221 549 L195 575 Z" fill="none" stroke="#c08bff" stroke-width="3"/>
  <circle cx="218" cy="538" r="8" fill="none" stroke="#c08bff" stroke-width="3"/>
  <path d="M188 568l-9 9" stroke="#c08bff" stroke-width="3" stroke-linecap="round"/>

  <text x="270" y="545" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="27" font-weight="800" letter-spacing="1">CYBERFORGE TOOLS</text>
  <text x="270" y="579" fill="#796e9d" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="13" letter-spacing="2.5">MCP-EXPOSED SECURITY CAPABILITIES</text>

  <line x1="165" y1="610" x2="835" y2="610" stroke="#3b2f60" stroke-width="1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
    <rect x="165" y="635" width="150" height="48" rx="16" fill="#a56cff" opacity=".08" stroke="#a56cff" stroke-width="1"/>
    <text x="240" y="665" text-anchor="middle" fill="#d0b0ff">Search</text>
    <rect x="335" y="635" width="150" height="48" rx="16" fill="#a56cff" opacity=".08" stroke="#a56cff" stroke-width="1"/>
    <text x="410" y="665" text-anchor="middle" fill="#d0b0ff">Analyze</text>
    <rect x="505" y="635" width="150" height="48" rx="16" fill="#a56cff" opacity=".08" stroke="#a56cff" stroke-width="1"/>
    <text x="580" y="665" text-anchor="middle" fill="#d0b0ff">Inspect</text>
    <rect x="675" y="635" width="160" height="48" rx="16" fill="#a56cff" opacity=".08" stroke="#a56cff" stroke-width="1"/>
    <text x="755" y="665" text-anchor="middle" fill="#d0b0ff">Contain</text>
  </g>

  <rect x="165" y="705" width="670" height="34" rx="17" fill="#a56cff" opacity=".07"/>
  <text x="500" y="728" text-anchor="middle" fill="#c39aff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">
    TOOL CALLS • ANALYSIS • RESPONSE
  </text>
</g>

<!-- Connector -->
<line x1="500" y1="765" x2="500" y2="845" stroke="#39e5c0" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"/>

<!-- EVIDENCE CARD -->
<g>
  <rect x="125" y="845" width="750" height="235" rx="34" fill="#36e5c0" opacity=".06" filter="url(#soft)"/>
  <rect x="125" y="835" width="750" height="235" rx="34" fill="#0b2025" stroke="url(#evidence)" stroke-width="3"/>
  <rect x="125" y="835" width="8" height="235" rx="4" fill="#36e5c0"/>

  <!-- evidence icon -->
  <circle cx="205" cy="905" r="38" fill="#36e5c0" opacity=".10"/>
  <path d="M184 889h31l12 12v28h-43z" fill="none" stroke="#55f0d0" stroke-width="3"/>
  <path d="M215 889v14h12M192 946h30" stroke="#55f0d0" stroke-width="3"/>
  <path d="M192 918h25M192 930h18" stroke="#55f0d0" stroke-width="2"/>

  <text x="270" y="900" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="27" font-weight="800" letter-spacing="1">EVIDENCE LAYER</text>
  <text x="270" y="934" fill="#648f8b" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="13" letter-spacing="2.5">OBSERVABLE SECURITY DATA</text>

  <line x1="165" y1="965" x2="835" y2="965" stroke="#244944" stroke-width="1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
    <circle cx="205" cy="1005" r="5" fill="#36e5c0"/>
    <text x="225" y="1011" fill="#c5ddd9">Logs</text>
    <circle cx="430" cy="1005" r="5" fill="#36e5c0"/>
    <text x="450" y="1011" fill="#c5ddd9">Processes</text>
    <circle cx="680" cy="1005" r="5" fill="#36e5c0"/>
    <text x="700" y="1011" fill="#c5ddd9">Network</text>
  </g>

  <rect x="165" y="1028" width="670" height="1" fill="#244944"/>
</g>

<!-- Footer -->
<text x="500" y="1140" text-anchor="middle" fill="#5f6d8f"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">
  REASON  →  ACT  →  OBSERVE
</text>
<circle cx="500" cy="1165" r="5" fill="#42f5b0" filter="url(#glow)"/>
</svg>