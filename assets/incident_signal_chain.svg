<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="55%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#03050f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d5ff"/>
      <stop offset="50%" stop-color="#9b6cff"/>
      <stop offset="100%" stop-color="#42f5b0"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a35"/>
      <stop offset="100%" stop-color="#0a1025"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#243056" stroke-width="1" opacity=".28"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8e7cff"/>
    </marker>
  </defs>

  <rect width="900" height="1500" fill="url(#bg)"/>
  <rect width="900" height="1500" fill="url(#grid)" opacity=".35"/>

  <!-- Ambient glow -->
  <ellipse cx="450" cy="740" rx="280" ry="650" fill="#694cff" opacity=".055" filter="url(#softGlow)"/>

  <!-- Header -->
  <text x="450" y="70" text-anchor="middle" fill="#8da0c9"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="5">
    INCIDENT EVIDENCE CHAIN
  </text>
  <text x="450" y="108" text-anchor="middle" fill="#ffffff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">
    ATTACK SIGNAL CORRELATION
  </text>

  <!-- Vertical spine -->
  <line x1="450" y1="150" x2="450" y2="1370"
        stroke="url(#line)" stroke-width="3" opacity=".5" filter="url(#glow)"/>

  <!-- Connector helper -->
  <g fill="none" stroke="#8e7cff" stroke-width="3" opacity=".9" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M450 345 V405"/>
    <path d="M450 585 V645"/>
    <path d="M450 825 V885"/>
    <path d="M450 1065 V1125"/>
  </g>

  <!-- CARD 01 -->
  <g>
    <rect x="105" y="165" width="690" height="180" rx="28" fill="#000" opacity=".25" filter="url(#softGlow)"/>
    <rect x="105" y="155" width="690" height="180" rx="28" fill="url(#card1)" stroke="#ff4f6d" stroke-width="2.5"/>
    <rect x="105" y="155" width="8" height="180" rx="4" fill="#ff4f6d"/>
    <circle cx="160" cy="205" r="25" fill="#ff4f6d" opacity=".12"/>
    <text x="160" y="214" text-anchor="middle" fill="#ff6680"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">01</text>
    <text x="215" y="205" fill="#ffffff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" letter-spacing="1">
      SSH BRUTE FORCE
    </text>
    <text x="215" y="255" fill="#9ba9c7"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
      Repeated authentication failures detected
    </text>
    <rect x="215" y="280" width="220" height="28" rx="14" fill="#ff4f6d" opacity=".10"/>
    <text x="325" y="300" text-anchor="middle" fill="#ff7b91"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">AUTH SIGNAL</text>
  </g>

  <!-- CARD 02 -->
  <g>
    <rect x="105" y="405" width="690" height="180" rx="28" fill="#000" opacity=".25" filter="url(#softGlow)"/>
    <rect x="105" y="395" width="690" height="180" rx="28" fill="url(#card1)" stroke="#39d5ff" stroke-width="2.5"/>
    <rect x="105" y="395" width="8" height="180" rx="4" fill="#39d5ff"/>
    <circle cx="160" cy="445" r="25" fill="#39d5ff" opacity=".12"/>
    <text x="160" y="454" text-anchor="middle" fill="#51dcff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">02</text>
    <text x="215" y="445" fill="#ffffff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" letter-spacing="1">
      SUCCESSFUL LOGIN
    </text>
    <text x="215" y="495" fill="#9ba9c7"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
      10.0.0.25
    </text>
    <rect x="215" y="520" width="190" height="28" rx="14" fill="#39d5ff" opacity=".10"/>
    <text x="310" y="540" text-anchor="middle" fill="#51dcff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">ACCESS EVENT</text>
  </g>

  <!-- CARD 03 -->
  <g>
    <rect x="105" y="645" width="690" height="180" rx="28" fill="#000" opacity=".25" filter="url(#softGlow)"/>
    <rect x="105" y="635" width="690" height="180" rx="28" fill="url(#card1)" stroke="#a56cff" stroke-width="2.5"/>
    <rect x="105" y="635" width="8" height="180" rx="4" fill="#a56cff"/>
    <circle cx="160" cy="685" r="25" fill="#a56cff" opacity=".12"/>
    <text x="160" y="694" text-anchor="middle" fill="#b681ff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">03</text>
    <text x="215" y="685" fill="#ffffff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" letter-spacing="1">
      HOST ACTIVITY
    </text>
    <text x="215" y="735" fill="#9ba9c7"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
      suspicious.py
    </text>
    <rect x="215" y="760" width="190" height="28" rx="14" fill="#a56cff" opacity=".10"/>
    <text x="310" y="780" text-anchor="middle" fill="#b681ff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">PROCESS SIGNAL</text>
  </g>

  <!-- CARD 04 -->
  <g>
    <rect x="105" y="885" width="690" height="180" rx="28" fill="#000" opacity=".25" filter="url(#softGlow)"/>
    <rect x="105" y="875" width="690" height="180" rx="28" fill="url(#card1)" stroke="#36e0c0" stroke-width="2.5"/>
    <rect x="105" y="875" width="8" height="180" rx="4" fill="#36e0c0"/>
    <circle cx="160" cy="925" r="25" fill="#36e0c0" opacity=".12"/>
    <text x="160" y="934" text-anchor="middle" fill="#4af0d0"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">04</text>
    <text x="215" y="925" fill="#ffffff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" letter-spacing="1">
      NETWORK SIGNAL
    </text>
    <text x="215" y="975" fill="#9ba9c7"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
      TCP :4444
    </text>
    <rect x="215" y="1000" width="180" height="28" rx="14" fill="#36e0c0" opacity=".10"/>
    <text x="305" y="1020" text-anchor="middle" fill="#4af0d0"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">NETWORK SIGNAL</text>
  </g>

  <!-- CARD 05 -->
  <g>
    <rect x="105" y="1125" width="690" height="180" rx="28" fill="#000" opacity=".25" filter="url(#softGlow)"/>
    <rect x="105" y="1115" width="690" height="180" rx="28" fill="url(#card1)" stroke="#ffc857" stroke-width="2.5"/>
    <rect x="105" y="1115" width="8" height="180" rx="4" fill="#ffc857"/>
    <circle cx="160" cy="1165" r="25" fill="#ffc857" opacity=".12"/>
    <text x="160" y="1174" text-anchor="middle" fill="#ffd56f"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">05</text>
    <text x="215" y="1165" fill="#ffffff"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" letter-spacing="1">
      HUMAN REVIEW
    </text>
    <text x="215" y="1215" fill="#9ba9c7"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
      Review  →  Decide
    </text>
    <rect x="215" y="1240" width="205" height="28" rx="14" fill="#ffc857" opacity=".10"/>
    <text x="317" y="1260" text-anchor="middle" fill="#ffd56f"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">DECISION GATE</text>
  </g>

  <!-- Bottom status -->
  <circle cx="450" cy="1370" r="7" fill="#42f5b0" filter="url(#glow)"/>
  <text x="450" y="1415" text-anchor="middle" fill="#607095"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">
    SIGNAL → CORRELATE → REVIEW
  </text>
</svg>