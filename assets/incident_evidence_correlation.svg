<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#040714"/>
    <stop offset="50%" stop-color="#0b1024"/>
    <stop offset="100%" stop-color="#03050d"/>
  </linearGradient>
  <linearGradient id="main" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#35d9ff"/>
    <stop offset="50%" stop-color="#a36cff"/>
    <stop offset="100%" stop-color="#36e8c0"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#263253" stroke-width="1" opacity=".25"/>
  </pattern>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#9a7cff"/>
  </marker>
</defs>

<rect width="1200" height="1000" fill="url(#bg)"/>
<rect width="1200" height="1000" fill="url(#grid)" opacity=".35"/>
<ellipse cx="600" cy="480" rx="420" ry="330" fill="#735cff" opacity=".055" filter="url(#soft)"/>

<!-- Title -->
<text x="600" y="65" text-anchor="middle" fill="#91a0c4"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5">
  DIGITAL FORENSICS • EVIDENCE FLOW
</text>
<text x="600" y="108" text-anchor="middle" fill="#ffffff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">
  INCIDENT EVIDENCE
</text>

<!-- Top vertical connector -->
<line x1="600" y1="135" x2="600" y2="185" stroke="url(#main)" stroke-width="4" filter="url(#glow)"/>

<!-- Branch line -->
<line x1="210" y1="185" x2="990" y2="185" stroke="url(#main)" stroke-width="3" filter="url(#glow)"/>
<line x1="210" y1="185" x2="210" y2="225" stroke="#35d9ff" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>
<line x1="600" y1="185" x2="600" y2="225" stroke="#a36cff" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>
<line x1="990" y1="185" x2="990" y2="225" stroke="#36e8c0" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>

<!-- AUTH LOG -->
<g>
  <rect x="65" y="225" width="290" height="245" rx="28" fill="#35d9ff" opacity=".06" filter="url(#soft)"/>
  <rect x="65" y="215" width="290" height="255" rx="28" fill="#0c1730" stroke="#35d9ff" stroke-width="2.5"/>
  <rect x="65" y="215" width="290" height="7" rx="3" fill="#35d9ff"/>
  <circle cx="115" cy="270" r="28" fill="#35d9ff" opacity=".12"/>
  <path d="M103 269 l9 9 18-21" fill="none" stroke="#55e2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="274" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">AUTH LOG</text>
  <line x1="95" y1="310" x2="325" y2="310" stroke="#263a61" stroke-width="1"/>
  <text x="210" y="360" text-anchor="middle" fill="#a9b6d1"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Who logged in?</text>
  <text x="210" y="405" text-anchor="middle" fill="#55e2ff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">IDENTITY SIGNAL</text>
  <circle cx="210" cy="440" r="5" fill="#35d9ff" filter="url(#glow)"/>
</g>

<!-- PROCESS DATA -->
<g>
  <rect x="455" y="225" width="290" height="245" rx="28" fill="#a36cff" opacity=".06" filter="url(#soft)"/>
  <rect x="455" y="215" width="290" height="255" rx="28" fill="#120e2e" stroke="#a36cff" stroke-width="2.5"/>
  <rect x="455" y="215" width="290" height="7" rx="3" fill="#a36cff"/>
  <circle cx="505" cy="270" r="28" fill="#a36cff" opacity=".12"/>
  <path d="M493 259h24M493 270h24M493 281h16" stroke="#b986ff" stroke-width="4" stroke-linecap="round"/>
  <text x="545" y="274" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">PROCESS DATA</text>
  <line x1="485" y1="310" x2="715" y2="310" stroke="#3a2f66" stroke-width="1"/>
  <text x="600" y="360" text-anchor="middle" fill="#a9b6d1"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">What executed?</text>
  <text x="600" y="405" text-anchor="middle" fill="#b986ff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">HOST SIGNAL</text>
  <circle cx="600" cy="440" r="5" fill="#a36cff" filter="url(#glow)"/>
</g>

<!-- NETWORK DATA -->
<g>
  <rect x="845" y="225" width="290" height="245" rx="28" fill="#36e8c0" opacity=".06" filter="url(#soft)"/>
  <rect x="845" y="215" width="290" height="255" rx="28" fill="#0b1d28" stroke="#36e8c0" stroke-width="2.5"/>
  <rect x="845" y="215" width="290" height="7" rx="3" fill="#36e8c0"/>
  <circle cx="895" cy="270" r="28" fill="#36e8c0" opacity=".12"/>
  <circle cx="895" cy="270" r="12" fill="none" stroke="#50f1d0" stroke-width="3"/>
  <path d="M875 270h40M895 250v40" stroke="#50f1d0" stroke-width="2"/>
  <text x="935" y="274" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">NETWORK DATA</text>
  <line x1="875" y1="310" x2="1105" y2="310" stroke="#28554e" stroke-width="1"/>
  <text x="990" y="360" text-anchor="middle" fill="#a9b6d1"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Where did it connect?</text>
  <text x="990" y="405" text-anchor="middle" fill="#50f1d0"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">NETWORK SIGNAL</text>
  <circle cx="990" cy="440" r="5" fill="#36e8c0" filter="url(#glow)"/>
</g>

<!-- Merge connectors -->
<line x1="210" y1="470" x2="210" y2="535" stroke="#35d9ff" stroke-width="3"/>
<line x1="600" y1="470" x2="600" y2="535" stroke="#a36cff" stroke-width="3"/>
<line x1="990" y1="470" x2="990" y2="535" stroke="#36e8c0" stroke-width="3"/>
<line x1="210" y1="535" x2="990" y2="535" stroke="url(#main)" stroke-width="3" filter="url(#glow)"/>
<line x1="600" y1="535" x2="600" y2="610" stroke="url(#main)" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"/>

<!-- Correlated signal -->
<g>
  <rect x="275" y="610" width="650" height="220" rx="34" fill="#8d65ff" opacity=".08" filter="url(#soft)"/>
  <rect x="275" y="600" width="650" height="220" rx="34" fill="#10142d" stroke="url(#main)" stroke-width="3"/>
  <circle cx="390" cy="710" r="52" fill="#8d65ff" opacity=".10"/>
  <path d="M363 710h22l14-22 17 44 14-22h22" fill="none" stroke="#b986ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="475" y="695" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="1">
    CORRELATED SIGNAL
  </text>
  <text x="475" y="742" fill="#9ba9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">
    Identity + host + network evidence
  </text>
  <rect x="475" y="765" width="230" height="28" rx="14" fill="#a36cff" opacity=".12"/>
  <text x="590" y="785" text-anchor="middle" fill="#c091ff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2.5">MULTI-SOURCE CORRELATION</text>
</g>

<!-- Footer -->
<text x="600" y="900" text-anchor="middle" fill="#5f6d8f"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">
  AUTHENTICATE  •  EXECUTE  •  CONNECT  •  CORRELATE
</text>
<circle cx="600" cy="925" r="5" fill="#42f5b0" filter="url(#glow)"/>
</svg>